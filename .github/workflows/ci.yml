name: CI

# The same contract, enforced without an agent in the room.
#
# `.claude/settings.json` gates an agent's edits as they happen, which is the
# fast feedback loop. This workflow is the slow one, and it is the answer to
# "what happens on a team that does not use that editor": nothing changes. The
# rules live in the repository, not in anyone's tooling, so a pull request from
# any editor, or from a human who has never read AGENTS.md, meets the same gate
# before it can merge.
#
# `gate --strict` is deliberately stricter than the hook. A declared `<Missing>`
# gap is a success state during development and never blocks the dev loop, but
# an unresolved gap is not something to release, so CI fails on it.

on:
  push:
    branches: [main]
  pull_request:

# Nx keeps a background daemon to watch the file graph. It speeds up a local
# edit-test loop and does nothing useful in a container that runs one command
# and exits, where it is only another moving part between a green run and a red
# one. Off everywhere in CI.
env:
  NX_DAEMON: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs from the lockfile exactly, so CI cannot silently pass
      # on a dependency tree that no one else has.
      - run: npm ci

      # tokens + components + type-check + the gate's own suite.
      # `pretest` compiles the token layer first, so this needs no manual step.
      - run: npm test

      # The design system's contract, applied to this repository's own source
      # and to the app that consumes it.
      - name: Check the design system contract
        run: npm run gate -- --strict

      - name: Build the consuming app
        run: npm run build:web

  # Threshold set at `critical`, not `high`, and the reason is the whole point.
  #
  # The known advisories are documented in SECURITY.md: three high, six
  # moderate, every one of them build-time tooling that parses this
  # repository's own files. Failing on `high` would mean this job is red on
  # every run forever, for issues already accounted for. That is precisely the
  # check nobody reads, and a permanently red job trains people to ignore the
  # one run that matters.
  #
  # `critical` is the level that is not already understood here, so a failure
  # means something genuinely new arrived and someone should look. Advisory as
  # well, so it reports rather than blocking a UI change from merging.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
